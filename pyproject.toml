[project]
name = "smart-character"
version = "0.1.0"
description = "游戏 NPC 角色扮演对话系统 - 基于 MiniMind-3o-MoE 的端侧角色扮演引擎"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "modelscope>=1.10",
]

[project.optional-dependencies]
train = [
    "datasets>=2.15",
    "accelerate>=0.30",
    "pyarrow>=15.0",
]

[tool.uv]
# 默认使用 GPU 版 torch（已预装则跳过）

[tool.uv.sources]
# 保持默认 PyPI 源
